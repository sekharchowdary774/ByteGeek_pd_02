<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); gap: 5px; justify-content: center; }
    .cell {
      width: 100px; height: 100px; font-size: 36px; background: #eee;
      display: flex; align-items: center; justify-content: center;
    }
    .cell input {
      background: none; border: none; font-size: 36px; cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  {% if winner %}
    <h2>{{ 'Draw!' if winner == 'Draw' else winner + ' Wins!' }}</h2>
    <a href="{{ url_for('reset') }}">Play Again</a>
  {% else %}
    <h3>Current Player: {{ current_player }}</h3>
  {% endif %}
  <form method="POST">
    <div class="board">
      {% for i in range(9) %}
        <div class="cell">
          {% if board[i] %}
            {{ board[i] }}
          {% elif not winner %}
            <button type="submit" name="position" value="{{ i }}"></button>
          {% endif %}
        </div>
      {% endfor %}
    </div>
  </form>
</body>
</html>
